<!doctype html>
<!-- Foto do perfil do canal, 800×800 (o YouTube recorta em círculo e mostra de 98×98 para cima). O quadrado inteiro é
     roxo, sem círculo desenhado: a versão de 2023 tinha o círculo encostado nas bordas e os cantos brancos, e o
     recorte do YouTube deixava um fio branco em volta. Mesmo roxo (#5500AA) e o mesmo «#», redesenhado
     em vetor com as medidas da versão anterior (assets/hash-perfil.svg: o ícone traçado da marca tem os cantos
     internos arredondados e tortos). -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 800px; height: 800px; overflow: hidden; background: #5500AA; }
  #hash { position: absolute; left: 0; top: 0; width: 800px; height: 800px; }
</style>
</head>
<body>
  <img id="hash" src="assets/hash-perfil.svg" alt="#" />
</body>
</html>
